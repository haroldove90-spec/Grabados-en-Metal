<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Metallic Steel & Titanium Gradients -->
    <linearGradient id="metalSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="brassAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <filter id="metalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Precision Engraving Grid & Calibration Crosshairs -->
  <g opacity="0.45" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 6">
    <line x1="256" y1="24" x2="256" y2="488" />
    <line x1="24" y1="256" x2="488" y2="256" />
    <circle cx="256" cy="256" r="210" stroke-width="1.5" />
    <circle cx="256" cy="256" r="140" stroke-width="1" />
  </g>

  <!-- Unencapsulated Faceted Metal Chisel / Diamond Cutter Monogram (Letter M & G Facets) -->
  <g filter="url(#metalGlow)">
    <!-- Left Facet - Stainless Steel Plate -->
    <path d="M120 410 L120 180 L256 90 L256 220 L180 270 L180 410 Z" fill="url(#metalSilver)" stroke="#475569" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Right Facet - Precision Mold Cavity Wall -->
    <path d="M392 410 L392 180 L256 90 L256 220 L332 270 L332 410 Z" fill="url(#darkSteel)" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Center Engraving V-Carve Diamond Blade -->
    <path d="M256 120 L320 230 L256 340 L192 230 Z" fill="url(#laserCyan)" opacity="0.9" stroke="#ffffff" stroke-width="2" />
    
    <!-- Precision CNC Mill / Engraving Burr Core -->
    <path d="M256 240 L280 290 L256 430 L232 290 Z" fill="url(#brassAccent)" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />
    
    <!-- Concentric Laser Etching Rings -->
    <path d="M200 370 Q256 420 312 370" stroke="url(#laserCyan)" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M170 395 Q256 455 342 395" stroke="#0284c7" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M140 420 Q256 490 372 420" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6" />

    <!-- Top Optical Precision Center Point -->
    <circle cx="256" cy="90" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="256" cy="90" r="6" fill="#ffffff" />
  </g>
</svg>
